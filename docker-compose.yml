services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vtr-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      GIN_MODE: ${GIN_MODE:-release}
      DB_URL: ${DB_URL}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY:-}
      AZURE_CONTAINER_NAME: ${AZURE_CONTAINER_NAME:-videos}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      CODEBOOK_MODEL: ${CODEBOOK_MODEL:-gemini-3.7-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-3.7-sonnet}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_key_video_teaching_research_2026}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      FFMPEG_PATH: ffmpeg
      MAX_CONCURRENT_CHUNKS: ${MAX_CONCURRENT_CHUNKS:-3}
      CHUNK_DURATION_SEC: ${CHUNK_DURATION_SEC:-600}
      CHUNK_OVERLAP_SEC: ${CHUNK_OVERLAP_SEC:-30}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    volumes:
      - backend-storage:/app/storage
    networks:
      - vtr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: vtr-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - backend
    networks:
      - vtr-network

volumes:
  backend-storage:
    driver: local

networks:
  vtr-network:
    driver: bridge
